version: 2

sources:
  - name: source_masters
    database: ae_exam_db
    schema: main
    description: "Source tables related to master data"
    tables:
      - name: customers_master
        description: "Contains basic information about all customers who have used the food delivery service."
        columns:
        - name: customer_id
          tests:
            - not_null
            - unique
      - name: drivers_master
        description: "Lists all delivery drivers in the system along with their background and service zones."
        columns:
        - name: driver_id
          tests:
            - not_null
            - unique
        - name: vehicle_type
          tests:
            - not_null
        - name: region
          tests:
            - not_null
        - name: active_status
          tests:
            - not_null
            - accepted_values:
                values:
                  - active
                  - inactive
        - name: driver_rating
          tests:
            - not_null
            - dbt_utils.accepted_range:
                min_value: 0
                max_value: 5
      - name: restaurants_master
        description: "Includes information about restaurants participating in the platform."
        columns:
        - name: restaurant_id
          tests:
            - not_null
            - unique
        - name: name
          tests:
            - not_null
            - unique
      - name: campaign_master
        description: "Details marketing campaigns that were launched throughout the year."
        columns:
        - name: campaign_id
          tests:
            - not_null
            - unique
        - name: campaign_name
          tests:
            - not_null
        - name: start_date
          tests:
            - not_null
        - name: end_date
          tests:
            - not_null
        - name: campaign_type
          tests:
            - not_null
        - name: channel
          tests:
            - not_null